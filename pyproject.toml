[project]
name = "decision-intelligence-rag"
version = "0.2.0"
description = "An independent research implementation for evaluating evidence-grounded RAG architectures, semantic retrieval strategies, answer correctness, and citation faithfulness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Lorenzo Nakayama Machado" }]
keywords = ["rag", "retrieval", "llm", "evaluation", "grounding", "information-retrieval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1",
    "httpx>=0.28",
]

[project.urls]
Repository = "https://github.com/LorenzoNMachado/decision-intelligence-rag"
Documentation = "https://github.com/LorenzoNMachado/decision-intelligence-rag/tree/main/docs"
Changelog = "https://github.com/LorenzoNMachado/decision-intelligence-rag/blob/main/CHANGELOG.md"

[project.optional-dependencies]
app = ["streamlit>=1.40"]

[project.scripts]
dirag = "decision_intelligence.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "decision_intelligence"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
packages = ["decision_intelligence"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
