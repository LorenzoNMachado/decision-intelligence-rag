name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra app --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run ruff check src tests app
          uv run ruff format --check src tests app
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Corpus integrity
        run: uv run dirag corpus-validate
      - name: Committed data is reproducible from the generator
        run: |
          uv run dirag corpus-generate --out "$RUNNER_TEMP/regen"
          for f in corpus.jsonl chunks.jsonl questions.json signal_index.rules.json; do
            diff -q "data/synthetic/$f" "$RUNNER_TEMP/regen/$f"
          done
      - name: Frozen protocol is intact
        run: uv run dirag verify-manifest
